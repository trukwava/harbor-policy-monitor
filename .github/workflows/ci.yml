name: Verify offline demo
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install project dependencies
        run: npm install
      - name: Check published source integrity
        run: node scripts/verify-package.mjs
      - name: Run deterministic acceptance tests
        run: npm test